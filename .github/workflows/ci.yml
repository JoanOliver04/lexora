name: CI

on:
  push:
    branches: [main]
  pull_request:

# The build/test pipeline needs no repository write token.
permissions:
  contents: read

# Cancel superseded work for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `next build` y `tsc` no necesitan conexion a la base de datos, pero
  # `src/env` valida al cargar el modulo y abortaria sin estas variables. Son
  # las del entorno local de Supabase: identicas en cualquier instalacion y sin
  # valor de secreto.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  # Deliberately public disposable-local key; revisit if endpoint changes (2027-Q1).
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH # gitleaks:allow

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secretos del historial
        # Official binary, pinned version and SHA256; no network validation of
        # credentials. Redaction applies to output and a finding fails the job.
        run: |
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/scanner.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/scanner.tar.gz" -C "$scanner_dir" gitleaks
          test "$("$scanner_dir/gitleaks" version)" = "8.30.1"
          "$scanner_dir/gitleaks" git --no-banner --redact --timeout 120 --log-opts="--all" .

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Desde `.nvmrc`, para que no haya dos sitios que definan la version.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        # `--frozen-lockfile` falla si el lockfile no corresponde al
        # `package.json`. Sin el, la CI instalaria versiones distintas de las
        # que se probaron en local y aprobaria un arbol que nadie ha ejecutado.
        run: pnpm install --frozen-lockfile

      - name: Vulnerabilidades de dependencias
        run: pnpm audit

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        # `pnpm typecheck` ejecuta `next typegen` antes de `tsc`. No es opcional:
        # el layout raiz usa tipos que Next.js genera, y sin ese paso la
        # comprobacion falla en cualquier arbol limpio. Descubierto en LEX-1.1.
        run: pnpm typecheck

      - name: Contraste WCAG
        run: pnpm contrast

      - name: Tests unitarios
        run: pnpm test

      - name: Integridad del backup cifrado
        run: pnpm ops:backup:test

      - name: Build de produccion
        run: pnpm build

  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Levantar Supabase local
        # Sin Studio ni los servicios que no participan en las pruebas: cada
        # contenedor de mas es tiempo de arranque en cada ejecucion.
        #
        # Con reintento: Docker Hub limita las descargas anonimas del runner
        # ("toomanyrequests: Rate exceeded") y un contenedor huerfano de otro
        # job puede dejar el puerto 54322 ocupado ("address already in use").
        # Ambos son transitorios y ajenos al codigo; se limpia y se reintenta
        # antes de dar el job por roto.
        run: |
          for attempt in 1 2 3; do
            if pnpm exec supabase start -x studio,imgproxy,vector,logflare; then
              exit 0
            fi
            echo "::warning::supabase start fallo (intento ${attempt}/3); limpiando y reintentando"
            pnpm exec supabase stop --no-backup || true
            docker ps -aq | xargs -r docker rm -f || true
            sleep $((attempt * 15))
          done
          echo "::error::supabase start fallo tras 3 intentos"
          exit 1

      - name: Aplicar migraciones desde una base limpia
        # Es la comprobacion que importa: que el esquema versionado se aplique
        # entero, en orden, sin ningun paso manual. Un `db reset` que pasa aqui
        # significa que un companero puede levantar el proyecto desde cero.
        run: pnpm db:reset

      - name: pgTAP y RLS
        run: pnpm db:test

      - name: Catálogo de idiomas sin seed
        run: pnpm db:test:catalogue

      - name: Recuperación aislada con Auth y RLS
        run: pnpm ops:recovery:verify

      - name: Integración de módulos contra Supabase local
        env:
          LEXORA_DB_TESTS: "1"
        run: pnpm test tests/unit/study/today-supabase.integration.test.ts tests/unit/study/session-review-supabase.integration.test.ts tests/unit/study/history-supabase.integration.test.ts tests/unit/preferences/preferences-supabase.integration.test.ts tests/unit/data-management/data-export-supabase.integration.test.ts tests/unit/data-management/account-deletion-supabase.integration.test.ts tests/unit/importing/import-transfer-supabase.integration.test.ts tests/unit/library/library-pages-supabase.integration.test.ts

      - name: Comprobar que los tipos generados estan al dia
        # El esquema es la fuente de verdad; `database.types.ts` es su reflejo.
        # Si se separan, el compilador aprueba consultas que la base rechazara
        # en ejecucion. Se regenera y se exige que el resultado sea identico al
        # que hay versionado.
        run: |
          pnpm db:types
          if ! git diff --quiet -- src/shared/infrastructure/supabase/database.types.ts; then
            echo "::error::database.types.ts no corresponde al esquema. Ejecuta 'pnpm db:types' y confirma el resultado en el mismo commit que la migracion."
            git diff -- src/shared/infrastructure/supabase/database.types.ts
            exit 1
          fi

  e2e:
    name: Extremo a extremo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Levantar Supabase local
        # El trabajo E2E prueba la aplicacion como se despliega, y la aplicacion
        # depende de la base de datos: `/api/health` responde 503 sin ella.
        #
        # Faltaba en la primera version de esta CI, y en local no se notaba
        # porque la base de datos siempre esta encendida. Lo encontro la propia
        # CI en LEX-1.13, que es exactamente para lo que existe.
        #
        # Con reintento por el mismo motivo que en el job "Base de datos":
        # "toomanyrequests" de Docker Hub y puertos ocupados por contenedores
        # huerfanos son transitorios y ajenos al codigo.
        run: |
          for attempt in 1 2 3; do
            if pnpm exec supabase start -x studio,imgproxy,vector,logflare; then
              exit 0
            fi
            echo "::warning::supabase start fallo (intento ${attempt}/3); limpiando y reintentando"
            pnpm exec supabase stop --no-backup || true
            docker ps -aq | xargs -r docker rm -f || true
            sleep $((attempt * 15))
          done
          echo "::error::supabase start fallo tras 3 intentos"
          exit 1

      - name: Instalar Chromium
        # Solo Chromium. Firefox y WebKit se anadiran cuando exista producto que
        # pueda romperse de forma distinta en cada motor; hoy solo alargarian
        # cada ejecucion.
        # El runner incluye Chrome y sus bibliotecas. Playwright valida las
        # dependencias al arrancar el navegador; una ausencia sigue fallando el gate.
        # Se descarga nuestro Chromium fijado sin instalar fuentes extra con apt,
        # cuyos mirrors fallaron por DNS antes de ejecutar cualquier prueba.
        run: pnpm exec playwright install chromium

      - name: Tests E2E
        run: pnpm e2e

      - name: Acceso personal sin registro
        env:
          LEXORA_TEST_PERSONAL_ACCESS: "1"
        run: pnpm exec playwright test --config playwright.personal.config.ts --retries=0

      - name: Preview sin acceso al backend personal
        run: pnpm exec playwright test --config playwright.preview.config.ts --retries=0

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
